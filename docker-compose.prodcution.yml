
services:
  app:
    build:
      context: .
      target: production
    container_name: wabot-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3001
    volumes:
      - storage-prod:/var/www/html/storage
    depends_on:
      - db
      - redis
    networks:
      - wabot-net

  web:
    build:
      context: .
      target: web
    container_name: wabot-web
    restart: unless-stopped
    # ports:
    #   - "8000:80"
    depends_on:
      - app
    networks:
      - wabot-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wabot.rule=Host(`wabot.yopihendriansah.com`)"
      - "traefik.http.routers.wabot.entrypoints=websecure"
      - "traefik.http.routers.wabot.tls.certresolver=myresolver"
      - "traefik.http.services.wabot.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-net"
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.0
    container_name: wabot-db
    restart: unless-stopped
    # ports:
    #   - "3307:3306"
    environment:
      MYSQL_DATABASE: wabot_db
      MYSQL_USER: yopi
      MYSQL_PASSWORD: Walatraherbal@
      MYSQL_ROOT_PASSWORD: Walatraherbal@
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - wabot-net
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:alpine
    container_name: wabot-redis
    restart: unless-stopped
    # ports:
    #   - "6380:6379"
    networks:
      - wabot-net
    security_opt:
      - no-new-privileges:true

  queue:
    build:
      context: .
      target: production
    container_name: wabot-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - .env
    environment:
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3001
    volumes:
      - storage-prod:/var/www/html/storage
    depends_on:
      - redis
      - db
    networks:
      - wabot-net
    security_opt:
      - no-new-privileges:true

  scheduler:
    build:
      context: .
      target: production
    container_name: wabot-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3001
    volumes:
      - storage-prod:/var/www/html/storage
    depends_on:
      - redis
      - db
    networks:
      - wabot-net
    security_opt:
      - no-new-privileges:true

  whatsapp-gateway:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: wabot-whatsapp
    restart: unless-stopped
    environment:
      PORT: 3001
      WHATSAPP_API_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
      WHATSAPP_AUTH_DIR: /usr/src/app/auth_info
      WHATSAPP_QR_TIMEOUT_MS: 60000
    volumes:
      - whatsapp-auth:/usr/src/app/auth_info
    networks:
      - wabot-net
    security_opt:
      - no-new-privileges:true

networks:
  wabot-net:
    driver: bridge
  traefik-net:
    external: true
volumes:
  dbdata:
  storage-prod:
  whatsapp-auth:
