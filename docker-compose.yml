
services:
  app:
    build: .
    container_name: wabot-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    networks:
      - wabot-net

  web:
    image: nginx:1.27-alpine
    container_name: wabot-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - wabot-net

  db:
    image: mysql:8.0
    container_name: wabot-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: wabot_db
      MYSQL_USER: yopi
      MYSQL_PASSWORD: Walatraherbal@
      MYSQL_ROOT_PASSWORD: Walatraherbal@
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - wabot-net

  redis:
    image: redis:alpine
    container_name: wabot-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - wabot-net

  queue:
    build:
      context: .
      target: production
    container_name: wabot-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - ./:/var/www/html
    depends_on:
      - redis
      - db
    networks:
      - wabot-net

  whatsapp-gateway:
    build: . # Sesuaikan dengan path folder tempat Dockerfile Baileys berada
    container_name: wabot-whatsapp
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - WHATSAPP_API_TOKEN=change-this-token
    volumes:
      - ./:/usr/src/app # Sesuaikan path folder Baileys
      - ./auth_info:/usr/src/app/auth_info # Agar sesi login WhatsApp tidak hilang saat container restart
    networks:
      - wabot-net

networks:
  wabot-net:
    driver: bridge

volumes:
  dbdata:
